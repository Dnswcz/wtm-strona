<style>
body{margin:0}
@keyframes wtm-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.main > *{animation:wtm-in .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:.42s}
.main > *:nth-child(1){animation-delay:0s}
.main > *:nth-child(2){animation-delay:.07s}
.main > *:nth-child(3){animation-delay:.14s}
.main > *:nth-child(4){animation-delay:.21s}
.main > *:nth-child(5){animation-delay:.28s}
.main > *:nth-child(6){animation-delay:.35s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.main > *{animation:none !important}}
a{color:#111;text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea{font-family:inherit}
.fld{width:100%;box-sizing:border-box;min-height:48px;padding:12px 14px;border:1px solid #8a857a;background:#ffffff;color:#111111;font-size:15px;border-radius:0}
.fld:focus{outline:2px solid #111111;outline-offset:1px}
.mapbg{background-color:#f3efe6;background-image:repeating-linear-gradient(0deg,transparent 0 39px,#e2dccf 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#e2dccf 39px 40px)}
@media (max-width:860px){
.shell{flex-direction:column !important}
.side{width:auto !important;border-right:0 !important;border-bottom:1px solid var(--line);padding:20px 24px !important}
.side nav{margin:12px 0 !important}
.main{padding:24px !important}
}
/* telefony i tablety */
.nav-toggle{display:none}
.nav-toggle .i-close{display:none}
.main a[href^="mailto:"]{overflow-wrap:anywhere}
.main img{max-width:100%}
@media (max-width:860px){
.side{flex-direction:column !important;justify-content:flex-start !important;padding:12px 20px !important}
.side > div:first-child{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.side > div:first-child > a:first-child img{width:64px !important}
.nav-toggle{display:inline-flex !important;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid #111111;background:#ffffff;color:#111111;font:500 14px/1 'Inter',Helvetica,Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
.side.is-open .nav-toggle .i-menu{display:none}
.side.is-open .nav-toggle .i-close{display:block}
.side nav{display:none;width:100%;margin:8px 0 0 !important;border-top:1px solid var(--line)}
.side.is-open nav{display:block}
.side nav a{padding:14px 0 !important;border-bottom:1px solid var(--line);font-size:16px !important}
.side > div:last-child{display:none !important}
.side.is-open > div:last-child{display:flex !important;align-items:center;justify-content:space-between;padding:6px 0 2px}
.main{padding:28px 20px 40px !important}
}
@media (max-width:860px) and (prefers-reduced-motion:no-preference){.side.is-open nav{animation:wtm-in .25s ease both}}
</style>
</head>

<p style="margin: 10px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(18px, 2vw, 28px); line-height: 1.2">Pomóż nam dbać o muzykę i Pałac Szustra</p>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px; margin-top: 40px">
<div style="flex: 999 1 420px; min-width: 0; max-width: 700px">
<p style="margin: 0 0 18px; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 23px; line-height: 1.45">Warszawskie Towarzystwo Muzyczne jest organizacją pozarządową bez stałej dotacji państwowej czy samorządowej. Działamy dzięki odpłatnej działalności statutowej, składkom członkowskim i darowiznom osób, którym bliska jest nasza misja.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.7">Wesprzeć nas można w dowolnym momencie i dowolną kwotą. Część sezonów koncertowych w Pałacu Szustra finansujemy z otwartych konkursów grantowych, dlatego każda darowizna realnie pomaga.</p>
<h2 style="margin: 40px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 28px">Na co przeznaczamy darowizny</h2>
<ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid #111111">
<li style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true" style="flex: none; margin-top: 7px"><path d="M6 0L12 6L6 12L0 6Z" fill="#111111"/></svg><span>Utrzymanie Pałacu Szustra i Domku Burgrabiego</span></li>
<li style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true" style="flex: none; margin-top: 7px"><path d="M6 0L12 6L6 12L0 6Z" fill="#111111"/></svg><span>Bibliotekę, Archiwum i Muzeum WTM</span></li>
<li style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true" style="flex: none; margin-top: 7px"><path d="M6 0L12 6L6 12L0 6Z" fill="#111111"/></svg><span>Sezony koncertowe w Pałacu Szustra</span></li>
</ul>
<h2 style="margin: 40px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 28px">Mecenat i sponsoring</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.7">Chcesz zostać mecenasem, sponsorem lub partnerem WTM? Napisz do zarządu przez formularz kontaktowy.</p>
<a href="kontakt.html" style="display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; padding: 0 22px; border: 1px solid #111111; font-size: 12px; letter-spacing: 0.08em">NAPISZ DO ZARZĄDU</a>
</div>

<p style="margin: 0 0 4px; font-size: 13px; color: #d9d4c8">Odbiorca</p>
<p style="margin: 0 0 18px; font-size: 15px; line-height: 1.5">Warszawskie Towarzystwo Muzyczne im. Stanisława Moniuszki<br>ul. Morskie Oko 2, 02-511 Warszawa</p>
<p style="margin: 0 0 4px; font-size: 13px; color: #d9d4c8">Tytuł przelewu</p>

<script>
class Component extends DCLogic {
renderVals() {
const navOpen = !!(this.state && this.state.navOpen);
return Object.assign(this.pageVals(), { navCls: navOpen ? 'is-open' : '', navExpanded: navOpen ? 'true' : 'false', navLabel: navOpen ? 'Zamknij' : 'Menu', toggleNav: () => this.setState({ navOpen: !navOpen }) });
}
pageVals() {
return { lineColor: this.props.lineColor ?? '#d9d1c0' };
}
}
WTM.mount(Component, {"lineColor": "#d9d1c0"});
</script>
