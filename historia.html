<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historia – Warszawskie Towarzystwo Muzyczne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes wtm-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.main > *{animation:wtm-in .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:.42s}
.main > *:nth-child(1){animation-delay:0s}
.main > *:nth-child(2){animation-delay:.07s}
.main > *:nth-child(3){animation-delay:.14s}
.main > *:nth-child(4){animation-delay:.21s}
.main > *:nth-child(5){animation-delay:.28s}
.main > *:nth-child(6){animation-delay:.35s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.main > *{animation:none !important}}
a{color:#111;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
@media (max-width:860px){
.shell{flex-direction:column !important}
.side{width:auto !important;border-right:0 !important;border-bottom:1px solid var(--line);padding:20px 24px !important}
.side nav{margin:12px 0 !important}
.main{padding:24px !important}
.row{flex-direction:column !important;gap:4px !important}
}
/* telefony i tablety */
.nav-toggle{display:none}
.nav-toggle .i-close{display:none}
.main a[href^="mailto:"]{overflow-wrap:anywhere}
.main img{max-width:100%}
@media (max-width:860px){
.side{flex-direction:column !important;justify-content:flex-start !important;padding:12px 20px !important}
.side > div:first-child{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.side > div:first-child > a:first-child img{width:64px !important}
.nav-toggle{display:inline-flex !important;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid #111111;background:#ffffff;color:#111111;font:500 14px/1 'Inter',Helvetica,Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
.side.is-open .nav-toggle .i-menu{display:none}
.side.is-open .nav-toggle .i-close{display:block}
.side nav{display:none;width:100%;margin:8px 0 0 !important;border-top:1px solid var(--line)}
.side.is-open nav{display:block}
.side nav a{padding:14px 0 !important;border-bottom:1px solid var(--line);font-size:16px !important}
.side > div:last-child{display:none !important}
.side.is-open > div:last-child{display:flex !important;align-items:center;justify-content:space-between;padding:6px 0 2px}
.main{padding:28px 20px 40px !important}
}
@media (max-width:860px) and (prefers-reduced-motion:no-preference){.side.is-open nav{animation:wtm-in .25s ease both}}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div class="shell" style="--line: {{lineColor}}; display: flex; min-height: 1000px; box-sizing: border-box; background: #ffffff; color: #111111; font-family: 'Inter', Helvetica, Arial, sans-serif">
<aside class="side {{navCls}}" style="width: 200px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid var(--line); padding: 64px 32px 24px; display: flex; flex-direction: column; justify-content: space-between">
<div>
<a href="index.html" aria-label="Warszawskie Towarzystwo Muzyczne – strona główna" style="display: block"><img src="obrazy/logo-wtm.png" alt="Logo WTM – rok założenia 1871" style="display: block; width: 120px; height: auto"></a>
<button type="button" class="nav-toggle" onClick="{{ toggleNav }}" aria-expanded="{{navExpanded}}" aria-controls="menu-glowne"><svg class="i-menu" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><svg class="i-close" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>{{navLabel}}</span></button>
<nav id="menu-glowne" style="margin-top: 36px" aria-label="Menu główne">
<a href="o-towarzystwie.html" style="display: block; padding: 12px 0; font-size: 15px">O Towarzystwie</a>
<a href="kalendarz.html" style="display: block; padding: 12px 0; font-size: 15px">Kalendarz</a>
<a href="historia.html" aria-current="page" style="display: block; padding: 12px 0; font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 6px">Historia</a>
<a href="biblioteka.html" style="display: block; padding: 12px 0; font-size: 15px">Biblioteka</a>
<a href="akademia.html" style="display: block; padding: 12px 0; font-size: 15px">Akademia Warszawskiego Towarzystwa Muzycznego</a>
<a href="wspolpraca.html" style="display: block; padding: 12px 0; font-size: 15px">Współpraca</a>
</nav>
</div>
<div>
<div style="display: flex; margin-left: -12px">
<a href="https://www.facebook.com/warszawskietowarzystwomuzyczne1871/" target="_blank" rel="noopener" aria-label="Facebook – Warszawskie Towarzystwo Muzyczne (otwiera się w nowej karcie)" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 22v-8h2.7l.5-3.2H13V8.7c0-1 .4-1.7 1.8-1.7h1.5V4.2C16 4.1 15 4 14 4c-2.5 0-4.2 1.5-4.2 4.3v2.5H7V14h2.8v8z"/></svg></a>
<a href="#" aria-label="Instagram" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg></a>
</div>
<a href="kontakt.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; letter-spacing: 0.04em; font-weight: 500; text-decoration: underline; text-underline-offset: 5px">Kontakt</a>
</div>
</aside>
<main class="main" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 64px 40px 56px 30px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: clamp(30px, 4.6vw, 66px); line-height: 1.05; letter-spacing: -0.01em; color: #0d0d0d">HISTORIA</h1>
<p style="margin: 10px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: clamp(18px, 2vw, 28px); line-height: 1.2">Warszawskie Towarzystwo Muzyczne od 1871 roku</p>
<section style="margin-top: 40px">
<h2 style="margin: 0 0 20px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 30px">Powstanie</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 190px; min-width: 0; box-sizing: border-box; padding-top: 14px; border-top: 1px solid #111111">
<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.04em">30 XI 1870</div>
<p style="margin: 8px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 19px; line-height: 1.3">Minister spraw wewnętrznych Królestwa Polskiego zatwierdza statut Towarzystwa Muzycznego Warszawskiego.</p>
</div>
<div style="flex: 1 1 190px; min-width: 0; box-sizing: border-box; padding-top: 14px; border-top: 1px solid #111111">
<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.04em">15 I 1871</div>
<p style="margin: 8px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 19px; line-height: 1.3">Pierwsze formalne spotkanie Komitetu Towarzystwa w Resursie Kupieckiej.</p>
</div>
<div style="flex: 1 1 190px; min-width: 0; box-sizing: border-box; padding-top: 14px; border-top: 1px solid #111111">
<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.04em">2 II 1871</div>
<p style="margin: 8px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 19px; line-height: 1.3">Wybór pierwszego zarządu: prezesem zostaje Sergiusz Muchanow, dyrektorem muzycznym Aleksander Zarzycki.</p>
</div>
<div style="flex: 1 1 190px; min-width: 0; box-sizing: border-box; padding-top: 14px; border-top: 1px solid #111111">
<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.04em">25 III 1871</div>
<p style="margin: 8px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 19px; line-height: 1.3">Otwarcie siedziby w Salach Redutowych Teatru Wielkiego, z biblioteką i czytelnią muzyczną.</p>
</div>
<div style="flex: 1 1 190px; min-width: 0; box-sizing: border-box; padding-top: 14px; border-top: 1px solid #111111">
<div style="font-size: 12px; font-weight: 500; letter-spacing: 0.04em">19 IV 1871</div>
<p style="margin: 8px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 19px; line-height: 1.3">Pierwszy „większy wieczór muzyczny” otwiera regularną działalność koncertową.</p>
</div>
</div>
</section>
<section style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; margin-top: 48px">
<div style="flex: 1 1 360px; min-width: 0">
<div style="font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase">Członkowie-założyciele</div>
<p style="margin: 8px 0 16px; font-size: 15px; line-height: 1.6">Wśród założycieli byli m.in. Adolf Bogucki, August Freier, Ludwik Grossman, Sergiusz Muchanow, Stanisław Moniuszko, Józef Sikorski, Ignacy Krzyżanowski, Adam Münchheimer, Wilhelm Troschel, Józef Wieniawski, Władysław Wiślicki i Robert Wolff.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.6">Inicjatorem powołania Towarzystwa był Władysław Wiślicki. Od 1951 roku WTM nosi imię Stanisława Moniuszki, a od 1966 roku ma własną siedzibę w Pałacu Szustra.</p>
</div>
<img src="obrazy/palac-fasada.jpg" alt="Pałac Szustra – neogotycka fasada ze schodami wejściowymi" style="flex: 1 1 320px; min-width: 0; max-width: 520px; height: 300px; object-fit: cover; object-position: 50% 40%; display: block">
</section>
<section style="margin-top: 56px">
<h2 style="margin: 0 0 6px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 30px">Kalendarium</h2>
<p style="margin: 0 0 20px; font-size: 14px">Wybrane wydarzenia z dziejów Towarzystwa</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px">
<sc-for list="{{eras}}" as="e" hint-placeholder-count="5">
<button onClick="{{ e.pick }}" style="height: 44px; padding: 0 16px; border: 1px solid #111111; background: {{e.bg}}; color: {{e.color}}; font-size: 13px; cursor: pointer">{{e.label}}</button>
</sc-for>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="margin-bottom: 32px">
<h3 style="margin: 0; padding-bottom: 8px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 26px; border-bottom: 1px solid #111111">{{g.label}}</h3>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="6">
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)">
<span style="flex: none; width: 150px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">{{r.date}}</span>
<span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">{{r.text}}</span>
</div>
</sc-for>
</div>
</sc-for>
</section>
<footer style="margin-top: 72px; padding-top: 28px; border-top: 1px solid #111111; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px 48px; font-size: 13px; line-height: 1.6">
<div><div style="font-weight: 500">Warszawskie Towarzystwo Muzyczne im. Stanisława Moniuszki</div><div>Pałac Szustra, ul. Morskie Oko 2, 02-511 Warszawa</div></div>
<div><div>tel. <a href="tel:+48228495651">22 849 56 51</a> · kom. <a href="tel:+48509019934">509 019 934</a></div><div><a href="mailto:wtm@wtm.org.pl">wtm@wtm.org.pl</a></div></div>
<nav aria-label="Stopka" style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 28px">
<a href="kontakt.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 5px">KONTAKT</a>
<a href="wsparcie.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 5px">WSPARCIE</a>
</nav>
</footer>
</main>
</div>
</script>
<script src="wtm.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const navOpen = !!(this.state && this.state.navOpen);
return Object.assign(this.pageVals(), { navCls: navOpen ? 'is-open' : '', navExpanded: navOpen ? 'true' : 'false', navLabel: navOpen ? 'Zamknij' : 'Menu', toggleNav: () => this.setState({ navOpen: !navOpen }) });
}
pageVals() {
const s = Object.assign({ era: 'all' }, this.state || {});
const E = [['e1', '1871–1899'], ['e2', '1900–1939'], ['e3', '1945–1989'], ['e4', '1990–dziś']];
const R = [
['1874','e1','Pierwsze wydawnictwo WTM: wyciąg fortepianowy na cztery ręce „Sonetów krymskich” Moniuszki.'],
['5 III 1880','e1','Tablica ku czci Chopina w kościele Świętego Krzyża, ufundowana przez WTM w miejscu spoczynku urny z jego sercem.'],
['1884','e1','Start Szkoły Muzycznej WTM.'],
['21 X 1887','e1','Pomnik Moniuszki w kościele Wszystkich Świętych na placu Grzybowskim, odsłonięty dzięki staraniom WTM.'],
['28 XII 1891','e1','Z inicjatywy Jana Karłowicza powstaje Sekcja im. Moniuszki, zbierająca rękopisy, druki i pamiątki po kompozytorze.'],
['14 X 1894','e1','Odsłonięcie pierwszego na ziemiach polskich pomnika Chopina z Żelazowej Woli, wzniesionego staraniem WTM. W tym roku nowa ulica w Warszawie otrzymuje imię Chopina.'],
['1 I 1895','e1','Rusza Sekcja Muzyki Kościelnej: kursy dla organistów, klasa organowa i „Rocznik dla Organistów”.'],
['14 V 1899','e1','Powstaje Sekcja im. Chopina, gromadząca pamiątki po kompozytorze.'],
['1900','e2','Dzięki staraniom WTM ulica przy budowanej Filharmonii otrzymuje imię Moniuszki.'],
['22 IV 1906','e2','Sekcja Muzyki Zbiorowej: amatorska orkiestra smyczkowa i zespoły kameralne.'],
['21 XII 1906','e2','Sekcja Naukowa zaczyna wydawać „Kwartalnik Muzyczny”, pierwsze polskie czasopismo muzykologiczne.'],
['29 X 1908','e2','Szczątki Moniuszki i jego żony trafiają do nowego grobowca ufundowanego przez WTM.'],
['1909','e2','Siedziba WTM przenosi się do gmachu Filharmonii Warszawskiej.'],
['1919','e2','Szkoła Muzyczna WTM otrzymuje uprawnienia i nazwę Wyższej Szkoły Muzycznej im. Fryderyka Chopina.'],
['23 I 1927','e2','Pierwszy Międzynarodowy Konkurs Pianistyczny im. Chopina, zorganizowany przez WTM i Wyższą Szkołę Muzyczną.'],
['3 V 1935','e2','Pierwszy Międzynarodowy Konkurs Skrzypcowy im. Henryka Wieniawskiego.'],
['IX 1939','e2','Bombardowanie niszczy gmach Filharmonii, a wraz z nim lokal i zbiory muzealne WTM.'],
['IX 1945','e3','Wznowienie działalności WTM i Wyższej Szkoły Muzycznej im. Chopina.'],
['26 IV 1951','e3','Uchwała o stworzeniu sieci ognisk muzycznych w Warszawie i okolicach.'],
['4 VI 1951','e3','W 80. rocznicę powstania Towarzystwo otrzymuje imię Stanisława Moniuszki.'],
['1959–1960','e3','Początek audycji umuzykalniających dla dzieci przedszkolnych i szkolnych.'],
['5 IX 1966','e3','Otwarcie pierwszej własnej siedziby w Pałacu Szustra, z wystawą o polskiej kulturze muzycznej XIX wieku.'],
['19–25 IV 1971','e3','Obchody stulecia WTM: wystawa w Muzeum Teatralnym i sesja o upowszechnianiu kultury muzycznej.'],
['1980–1989','e3','Cztery edycje konkursu na wykonanie pieśni Moniuszki dla studentów uczelni muzycznych (1980, 1984, 1986, 1989).'],
['IX 1994','e4','Wystawa w Pałacu Szustra w 80. rocznicę urodzin Andrzeja Panufnika.'],
['25 III 1996','e4','Początek obchodów 125-lecia wystawą „WTM 1871–1996. Historia i zbiory” w Muzeum Historycznym m.st. Warszawy.'],
['2–3 VIII 1996','e4','Pierwszy Międzynarodowy Festiwal Organowy „Johann Sebastian Bach” w Warszawie i Łowiczu.'],
['XII 2000','e4','Katalog polskich druków muzycznych z lat 1801–1875 ze zbiorów Biblioteki, Muzeum i Archiwum WTM, na 130-lecie biblioteki.'],
['4 VI 2002','e4','Pamiątki po Moniuszce ze zbiorów jego prawnuka trafiają do WTM; koncert w 130. rocznicę śmierci kompozytora.'],
['1 X 2006','e4','Koncert jubileuszowy z okazji 135-lecia WTM.'],
['4 I 2008','e4','Wystawa o „Halce” Moniuszki w 150. rocznicę prapremiery, zorganizowana z Muzeum Teatralnym.'],
['30 XI 2025','e4','Wystawa „Pierwszy akord” i koncert muzyki twórców-założycieli WTM w Pałacu Szustra.']
];
const eras = [['all', 'Wszystkie']].concat(E).map((x) => ({ label: x[1], bg: s.era === x[0] ? '#111111' : '#ffffff', color: s.era === x[0] ? '#ffffff' : '#111111', pick: () => this.setState({ era: x[0] }) }));
const groups = E.filter((x) => s.era === 'all' || s.era === x[0]).map((x) => ({ label: x[1], rows: R.filter((r) => r[1] === x[0]).map((r) => ({ date: r[0], text: r[2] })) }));
return { lineColor: this.props.lineColor ?? '#d9d1c0', eras: eras, groups: groups };
}
}
WTM.mount(Component, {"lineColor": "#d9d1c0"});
</script>
</body>
</html>
