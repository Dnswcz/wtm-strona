<section id="biblioteka" style="margin-top: 72px">
<h2 style="margin: 0 0 18px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 32px">Biblioteka, Archiwum i Muzeum WTM</h2>
<p style="margin: 0 0 28px; max-width: 760px; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px; line-height: 1.45">Gromadzi materiały dokumentujące polską kulturę muzyczną XIX wieku, ze szczególnym uwzględnieniem życia muzycznego Warszawy. Jej początki sięgają 1871 roku, kiedy wraz z Towarzystwem otwarto czytelnię muzyczną.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 24px">
<div style="padding-top: 14px; border-top: 1px solid #111111"><div style="font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums"><span aria-hidden="true">{{cnt.a}}</span><span class="sr">47 500+</span></div><div style="margin-top: 8px; font-size: 13px; line-height: 1.4">jednostek zbiorów</div></div>
<div style="padding-top: 14px; border-top: 1px solid #111111"><div style="font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums"><span aria-hidden="true">{{cnt.b}}</span><span class="sr">4 300</span></div><div style="margin-top: 8px; font-size: 13px; line-height: 1.4">rękopisów muzycznych</div></div>
<div style="padding-top: 14px; border-top: 1px solid #111111"><div style="font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums"><span aria-hidden="true">{{cnt.c}}</span><span class="sr">36 000</span></div><div style="margin-top: 8px; font-size: 13px; line-height: 1.4">druków muzycznych</div></div>
<div style="padding-top: 14px; border-top: 1px solid #111111"><div style="font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums"><span aria-hidden="true">{{cnt.d}}</span><span class="sr">4 500</span></div><div style="margin-top: 8px; font-size: 13px; line-height: 1.4">książek o muzyce</div></div>
<div style="padding-top: 14px; border-top: 1px solid #111111"><div style="font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums"><span aria-hidden="true">{{cnt.e}}</span><span class="sr">185</span></div><div style="margin-top: 8px; font-size: 13px; line-height: 1.4">tytułów czasopism muzycznych, polskich i zagranicznych</div></div>
</div>
</section>

<section id="zbiory" style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px; margin-top: 72px">
<div style="flex: 1 1 380px; min-width: 0">
<h2 style="margin: 0 0 18px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 32px">Zbiory</h2>
<ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid #111111">
<li style="padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.6">Kolekcje muzyczne Józefa Wielhorskiego, Józefa Sikorskiego, Adama Münchheimera i Jana Karłowicza</li>
<li style="padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.6">Spuścizny kompozytorskie Stanisława Moniuszki, Zygmunta Noskowskiego, Mieczysława Karłowicza i Henryka Swolkienia</li>
<li style="padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.6">Autograf wyciągu fortepianowego „Nędzy uszczęśliwionej” Macieja Kamieńskiego (1778), pierwszej polskiej opery</li>
<li style="padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.6">Autografy Jana Stefaniego, Karola Kurpińskiego i Józefa Elsnera</li>
<li style="padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.6">Autografy i autoryzowane kopie wszystkich oper Moniuszki oraz pojedyncze autografy m.in. Chopina i Szymanowskiego</li>
<li style="padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.6">Korespondencja: około 700 listów Moniuszki oraz listy m.in. Chopina, Brahmsa, Noskowskiego, M. Karłowicza i Rogowskiego</li>
</ul>
</div>
<div style="flex: 1 1 340px; min-width: 0">
<h2 style="margin: 0 0 18px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 32px">Dostęp i katalogi</h2>
<p style="margin: 0 0 14px; font-size: 15px; line-height: 1.7">Zbiory są udostępniane wyłącznie na miejscu, w czytelni. Czytelnia ma katalogi kartkowe rękopisów, druków muzycznych, książek, czasopism i fotografii.</p>
<p style="margin: 0 0 14px; font-size: 15px; line-height: 1.7">Najcenniejsze rękopisy zmikrofilmowano, a negatywy przechowuje Biblioteka Narodowa w Warszawie. Część zbiorów zdigitalizowano we współpracy z Narodowym Instytutem Fryderyka Chopina.</p>
<a href="https://polish.musicsources.pl/pl/szukaj/values?keyword=warszawskie%20towarzystwo%20muzyczne&amp;search_fields=%5B%5D" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 8px; padding: 0 22px; background: #111111; color: #ffffff; font-size: 12px; letter-spacing: 0.08em">ZDIGITALIZOWANE ZBIORY</a>
<div style="margin-top: 24px; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase">Katalogi drukowane</div>
<p style="margin: 8px 0 10px; font-size: 15px; line-height: 1.6">Andrzej i Irena Spóz, <em>Katalog polskich druków muzycznych 1801–1875</em>, Warszawa 2000.</p>
<p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6">Elżbieta Wąsowska, <em>Rękopisy muzyczne XIX–XX wieku</em>, t. 1–4, red. Andrzej Spóz, Warszawa: Biblioteka Narodowa, 2001.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.6">Dokumenty biblioteki i archiwum są też dostępne przez <a href="https://rism.info" target="_blank" rel="noopener" style="text-decoration: underline">RISM</a>.</p>
</div>
</section>

<section id="historia-biblioteki" style="margin-top: 72px">
<h2 style="margin: 0 0 18px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 32px">Historia biblioteki</h2>
<div style="border-top: 1px solid #111111">
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1871</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">Biblioteka i czytelnia muzyczna powstają razem z WTM w Salach Redutowych Teatru Wielkiego. Zbiory liczą wtedy kilkadziesiąt książek i kilka tysięcy nut, głównie z darów wydawców i członków.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1891–1899</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">Powstają sekcje im. Moniuszki i im. Chopina. Jan Karłowicz systematycznie gromadzi rękopisy, druki i pamiątki po obu kompozytorach.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1909</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">WTM wraz z biblioteką i szkołą muzyczną przenosi się do gmachu Filharmonii Warszawskiej.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1939–1944</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">We wrześniu 1939 roku zbiory muzealne przepadają w Filharmonii. Rękopisy wywieziono w 1944 roku na Dolny Śląsk, gdzie odnaleziono je rok później. Straty sięgają około 40% rękopisów, a druki nutowe i część archiwum zniszczono podczas powstania.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1945–1956</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">Odbudowa zbiorów. Biblioteka mieści się tymczasowo w różnych lokalach.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1956</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">Zbiory trafiają do budynku przy ul. Zakroczymskiej 2, gdzie działają do dziś.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1959</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">Placówka otrzymuje nazwę Biblioteka, Muzeum i Archiwum WTM.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">1998</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">Zbiory zostają wpisane do Narodowego Zasobu Bibliotecznego.</span></div>
<div class="row" style="display: flex; align-items: baseline; gap: 24px; padding: 16px 8px; border-bottom: 1px solid var(--line)"><span style="flex: none; width: 120px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em">od 2002</span><span style="flex: 1; min-width: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.35">Cykl koncertów „Z muzycznej przeszłości Warszawy”, wystawy i sesje naukowe oraz wypożyczanie eksponatów innym muzeom. Konserwację, oprawę i opracowanie spuścizn kompozytorskich wspierają Ministerstwo Kultury i Dziedzictwa Narodowego oraz m.st. Warszawa.</span></div>
</div>
</section>

<section id="zdjecia" style="margin-top: 72px">
<h2 style="margin: 0 0 18px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 32px">Zdjęcia</h2>
<p style="margin: 0 0 18px; max-width: 760px; font-size: 15px; line-height: 1.65">Miejsce na zdjęcia czytelni, zbiorów i eksponatów przy ul. Zakroczymskiej 2. Zdjęcia Pałacu Szustra są na stronie <a href="o-towarzystwie.html" style="text-decoration: underline">O Towarzystwie</a>.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 1 1 220px; height: 160px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 12px; border: 1px dashed #8a857a; background: #faf8f3; text-align: center; font-size: 11px; line-height: 1.4; letter-spacing: 0.04em; color: #3f3c36">[ZDJĘCIE BIBLIOTEKI – DO DODANIA]</div>
<div style="flex: 1 1 220px; height: 160px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 12px; border: 1px dashed #8a857a; background: #faf8f3; text-align: center; font-size: 11px; line-height: 1.4; letter-spacing: 0.04em; color: #3f3c36">[ZDJĘCIE BIBLIOTEKI – DO DODANIA]</div>
<div style="flex: 1 1 220px; height: 160px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 12px; border: 1px dashed #8a857a; background: #faf8f3; text-align: center; font-size: 11px; line-height: 1.4; letter-spacing: 0.04em; color: #3f3c36">[ZDJĘCIE BIBLIOTEKI – DO DODANIA]</div>
</div>

<section id="lokalizacja" style="margin-top: 72px">
<h2 style="margin: 0 0 18px; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 32px">Lokalizacja i kontakt</h2>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px">

<script>
class Component extends DCLogic {
componentDidMount() {
const reduce = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = document.getElementById('biblioteka');
if (reduce) { this.setState({ cp: 1 }); return; }
if (!el || typeof IntersectionObserver === 'undefined') { this.runCount(); return; }
this.io = new IntersectionObserver((ents) => {
if (ents.some((e) => e.isIntersecting)) { this.io.disconnect(); this.runCount(); }
}, { threshold: 0.35 });
this.io.observe(el);
}
componentWillUnmount() {
if (this.io) this.io.disconnect();
if (this.raf) cancelAnimationFrame(this.raf);
}
runCount() {
const t0 = performance.now(), D = 1800;
const step = (now) => {
const k = Math.min(1, (now - t0) / D);
this.setState({ cp: 1 - Math.pow(1 - k, 3) });
if (k < 1) this.raf = requestAnimationFrame(step);
};
this.raf = requestAnimationFrame(step);
}
renderVals() {
const navOpen = !!(this.state && this.state.navOpen);
return Object.assign(this.pageVals(), { navCls: navOpen ? 'is-open' : '', navExpanded: navOpen ? 'true' : 'false', navLabel: navOpen ? 'Zamknij' : 'Menu', toggleNav: () => this.setState({ navOpen: !navOpen }) });
}
pageVals() {
const s = Object.assign({ photo: 0, period: 0, place: 0, cp: 0 }, this.state || {});
const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
const C = (v, suf) => fmt(v * s.cp) + (suf || '');
const PH = [
{ src: 'obrazy/palac-fasada.jpg', alt: 'Pałac Szustra – neogotycka fasada z wejściem i schodami', cap: 'Pałac Szustra – fasada z wejściem głównym', fit: 'cover', pos: '50% 40%' },
{ src: 'obrazy/palac-staw.jpg', alt: 'Pałac Szustra widziany zza stawu, jesienią', cap: 'Pałac Szustra widziany zza stawu', fit: 'contain', pos: '50% 50%' },
{ src: 'obrazy/kwartet.jpg', alt: 'Kwartet smyczkowy w sali pałacowej', cap: 'Kwartet smyczkowy w sali pałacowej', fit: 'contain', pos: '50% 50%' },
{ src: 'obrazy/fortepian.jpg', alt: 'Pianista przy fortepianie', cap: 'Recital fortepianowy', fit: 'cover', pos: '50% 60%' }
];
const PER = [
{ label: 'Wrzesień–grudzień', text: 'Wtorki i czwartki, godz. 12.00–16.00.' },
{ label: 'Styczeń–czerwiec', text: 'Biblioteka czynna po wcześniejszym umówieniu.' },
{ label: 'Lipiec–sierpień 2026', text: 'Biblioteka, Archiwum i Muzeum są nieczynne.' }
];
const PL = [
{ tab: 'Biblioteka', name: 'Biblioteka, Archiwum i Muzeum WTM', addr: 'ul. Zakroczymska 2, 00-225 Warszawa', href: 'https://www.google.com/maps/search/?api=1&query=52.2536832%2C21.0069485' }
];
const n = PH.length;
return {
cnt: { a: C(47500, '+'), b: C(4300), c: C(36000), d: C(4500), e: C(185) },
lineColor: this.props.lineColor ?? '#d9d1c0',
ph: PH[s.photo], phCount: (s.photo + 1) + ' / ' + n,
prevPh: () => this.setState({ photo: (s.photo + n - 1) % n }),
nextPh: () => this.setState({ photo: (s.photo + 1) % n }),
thumbs: PH.map((p, i) => ({ src: p.src, label: 'Zdjęcie ' + (i + 1) + ': ' + p.cap, pressed: i === s.photo ? 'true' : 'false', border: i === s.photo ? '3px solid #111111' : '3px solid transparent', pick: () => this.setState({ photo: i }) })),
periods: PER.map((p, i) => ({ label: p.label, pressed: i === s.period ? 'true' : 'false', bg: i === s.period ? '#111111' : '#ffffff', color: i === s.period ? '#ffffff' : '#111111', pick: () => this.setState({ period: i }) })),
per: PER[s.period],
places: PL.map((p, i) => ({ tab: p.tab, pressed: i === s.place ? 'true' : 'false', bg: i === s.place ? '#111111' : '#ffffff', color: i === s.place ? '#ffffff' : '#111111', pick: () => this.setState({ place: i }) })),
pl2: PL[s.place]
};
}
}
WTM.mount(Component, {"lineColor": "#d9d1c0"});
</script>
