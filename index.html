<style>
body{margin:0}
@keyframes wtm-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.main > *{animation:wtm-in .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:.42s}
.main > *:nth-child(1){animation-delay:0s}
.main > *:nth-child(2){animation-delay:.07s}
.main > *:nth-child(3){animation-delay:.14s}
.main > *:nth-child(4){animation-delay:.21s}
.main > *:nth-child(5){animation-delay:.28s}
.main > *:nth-child(6){animation-delay:.35s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.main > *{animation:none !important}}
a{color:#111;text-decoration:none}a:hover{text-decoration:underline}
.ev{position:absolute;box-sizing:border-box;border-left:1px solid var(--line);padding-left:10px}
.a11-btn:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.a-contrast,.a-contrast *{background-color:#000 !important;color:#ffea00 !important;border-color:#ffea00 !important}
.a-contrast a{text-decoration:underline !important}
.a-light,.a-light *{background-color:#fff !important;color:#000 !important}
.a-neg img{filter:invert(1)}
.a-links a{text-decoration:underline !important}
.a-fonts,.a-fonts *{font-family:Arial,Helvetica,sans-serif !important}
@media (max-width:860px){
.shell{flex-direction:column !important}
.side{width:auto !important;border-right:0 !important;border-bottom:1px solid var(--line);padding:20px 24px !important}
.side nav{margin:12px 0 !important}
.main{padding:24px !important}
.grid{grid-template-columns:1fr !important;grid-template-rows:none !important}
.grid > *{grid-column:1 !important}
.grid img{height:220px !important;grid-row:auto !important}
.tl{height:auto !important;position:static !important;display:flex;flex-direction:column;gap:18px;margin:36px 0 0 !important}
.tl .ev,.tl .dt{position:static !important;transform:none !important;height:auto !important;width:auto !important;padding-top:0 !important}
.tl .ln{display:none}
}
.grid{width:auto !important;max-width:1167px;height:auto !important}
.grid > *{min-width:0}
.grid > p{width:auto !important;height:auto !important}
.grid img{max-width:100%}
@media (max-width:1280px){

.tl .ev,.tl .dt{position:static !important;transform:none !important;height:auto !important;width:auto !important;padding-top:0 !important;left:auto !important;top:auto !important}
.tl .dt{padding:0 !important}
.tl .ln{display:none}
}

.main a[href^="mailto:"]{overflow-wrap:anywhere}

<script>
class Component extends DCLogic {
renderVals() {
const navOpen = !!(this.state && this.state.navOpen);
return Object.assign(this.pageVals(), { navCls: navOpen ? 'is-open' : '', navExpanded: navOpen ? 'true' : 'false', navLabel: navOpen ? 'Zamknij' : 'Menu', toggleNav: () => this.setState({ navOpen: !navOpen }) });
}
pageVals() {
const s = Object.assign({ open: false, zi: 2, gray: false, contrast: false, neg: false, light: false, links: false, fonts: false }, this.state || {});
const Z = [0.85, 0.92, 1, 1.1, 1.2, 1.35, 1.5];
const T = [['gray', 'Szarość'], ['contrast', 'Wysoki kontrast'], ['neg', 'Negatyw'], ['light', 'Jasne tło'], ['links', 'Podkreślone linki'], ['fonts', 'Proste czcionki']];
const MODES = ['contrast', 'neg', 'light'];
const pick = (k) => () => {
const next = { [k]: !s[k] };
if (!s[k] && MODES.indexOf(k) >= 0) { MODES.forEach((m) => { if (m !== k) next[m] = false; }); }
this.setState(next);
};
const filters = [];
if (s.gray) filters.push('grayscale(1)');
if (s.neg) filters.push('invert(1)');
const cls = [];
if (s.contrast) cls.push('a-contrast');
if (s.light) cls.push('a-light');
if (s.neg) cls.push('a-neg');
if (s.links) cls.push('a-links');
if (s.fonts) cls.push('a-fonts');
return {
lineColor: this.props.lineColor ?? '#d9d1c0',
a11yClass: cls.join(' '),
filterValue: filters.length ? filters.join(' ') : 'none',
zoomValue: Z[s.zi],
zoomPct: Math.round(Z[s.zi] * 100) + '%',
a11yOpen: s.open, a11yExpanded: s.open ? 'true' : 'false',
toggle: () => this.setState({ open: !s.open }),
bigger: () => this.setState({ zi: Math.min(s.zi + 1, Z.length - 1) }),
smaller: () => this.setState({ zi: Math.max(s.zi - 1, 0) }),
reset: () => this.setState({ zi: 2, gray: false, contrast: false, neg: false, light: false, links: false, fonts: false }),
a11yToggles: T.map((x) => ({ label: x[1], pressed: s[x[0]] ? 'true' : 'false', bg: s[x[0]] ? '#0b57d0' : '#ffffff', color: s[x[0]] ? '#ffffff' : '#111111', pick: pick(x[0]) }))
};
}
}
WTM.mount(Component, {"lineColor": "#d9d1c0"});
</script>
